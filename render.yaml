# Render blueprint for the Karyavahi demo (https://render.com/docs/blueprint-spec).
#
# Free plan: the service sleeps after about 15 minutes without visits (the next visit takes about
# a minute) and the file system is not kept, so every restart begins again from the demo seed
# (`npm start` runs db-init first, which copies the pristine database). Uploaded proof photos are
# lost on a restart too. For a demo that resets itself, that is fine; for a pilot, use a paid plan
# with a disk, or Postgres (see docs/ROADMAP.md).
services:
  - type: web
    name: karyavahi
    runtime: node
    plan: free
    region: singapore
    # The app imports the shared domain rules from ../src, so the whole repository is built; the
    # commands run inside app/.
    # db:prewarm prepares the database during the build, so a woken instance starts in seconds.
    buildCommand: cd app && npm ci && npm run build && npm run db:prewarm
    startCommand: cd app && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # node:sqlite needs Node 22.13 or later; the app is developed and tested on Node 24.
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Back to the demo seed once a night (03:00 India time), so each morning starts clean.
      - key: KV_NIGHTLY_RESET
        value: "on"
      # Secrets: entered in the Render dashboard when the blueprint is created, never committed.
      - key: ANTHROPIC_API_KEY
        sync: false
      # A browser key, built into the pages at build time. Restrict it to this site's address in
      # the Google Cloud console (HTTP referrers) before relying on it.
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
      # WhatsApp through Meta's free Cloud API test number (app/README.md, "WhatsApp (Meta Cloud API
      # test number)"). Without the token and the phone number id, the outbox stays simulated.
      # WHATSAPP_TEST_RECIPIENTS holds the testers' real numbers (persona email=+E.164, comma-separated);
      # they live only here, never in the database, logs or pages.
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TEST_RECIPIENTS
        sync: false
      # Optional; defaults to v23.0.
      - key: WHATSAPP_GRAPH_VERSION
        sync: false
